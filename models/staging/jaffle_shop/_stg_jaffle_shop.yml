models:
  - name: stg_customers
    description: one unique customer per row
    columns:
      - name: customer_id
        description: primary key
        data_tests:
          - unique
          - not_null
          
  - name: stg_orders
    description: one unique order per row
    columns:
      - name: order_id
        description: primary key
        data_tests:
          - unique
          - not_null       
      - name: order_status
        description: '{{ doc("order_status") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed','shipped','completed','returned','return_pending']  
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id               