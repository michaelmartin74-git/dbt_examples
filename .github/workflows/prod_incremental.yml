name: Production Daily Incremental Run

on:
  schedule:
    - cron: '0 5 * * 1-6' # 5:00 AM, Monday to Saturday

jobs:
  run_dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        run: |
          pip install dbt-core dbt-bigquery
          dbt deps

      - name: Execute Incremental Run
        run: dbt build --target prod